services:
  postgres:
    image: postgres:17
    container_name: piscineds
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuehara
      POSTGRES_DB: piscineds
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuehara -d piscineds"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
